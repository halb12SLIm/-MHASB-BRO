name: Build APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install
      - name: Build Web
        run: npm run build
      - name: Build Status
        run: echo "Web build successful. Note: This action does not generate an APK automatically. APK generation requires a full Android build environment (Capacitor + Android SDK) configured in the repository."
